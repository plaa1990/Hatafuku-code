    <script>
      // Immediate fallback if opened as local file:/// (Android My Files, Downloads, etc.)

      }

  <body class="bg-[#f4f1e8] text-[#24483e] antialiased selection:bg-[#315f53]/20">

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safety watchdog: If React didn't render within 1.2s (e.g. outside Vite dev server), load standalone UI
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          window.location.replace('./standalone-index.html');
        }
      }, 1200);
    </script>
